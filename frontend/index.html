<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal WiFi Omada - Acceso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌐 Portal WiFi</h1>
      <p>Selecciona un plan y conecta ahora</p>
    </div>

    <form id="access-form">
      <div class="form-group">
        <label for="phone">📱 Teléfono (Pago Móvil):</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          required 
          placeholder="0414-1234567"
          pattern="[0-9\-]{10,15}"
        >
        <small>Formato: 0414-1234567</small>
      </div>

      <div class="form-group">
        <label for="plan">⏱️ Selecciona tu plan:</label>
        <select id="plan" name="plan" required>
          <option value="">Cargando planes...</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">💳 Pagar y Conectar</button>
    </form>

    <div id="status" class="status-message"></div>
    
    <div class="info-section">
      <h3>ℹ️ Información</h3>
      <p>Planes desde <strong>Bs 1.50</strong> por hora</p>
      <p>Pago seguro con Bancomercantil</p>
    </div>

    <footer>
      <small>Portal WiFi © 2024 | Powered by Omada + Bancomercantil</small>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
